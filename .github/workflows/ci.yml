name: CI

on:
  push:
    branches: [main, android]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    name: iOS build + unit tests
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.6.app
      - name: Pick a simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j \
            | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next(x["udid"] for k in sorted(d, reverse=True) if "iOS" in k for x in d[k] if x["name"].startswith("iPhone")))')
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
      - name: Build
        run: |
          xcodebuild -project MobilePrompt.xcodeproj -scheme MobilePrompt \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" -quiet build
      - name: Unit tests
        run: |
          xcodebuild -project MobilePrompt.xcodeproj -scheme MobilePrompt \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -resultBundlePath build/ci.xcresult \
            CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" test 2>&1 | tee xcodebuild-test.log | grep -E "Test Suite|Test Case|error:|TEST (SUCCEEDED|FAILED)"
          test "${PIPESTATUS[0]}" -eq 0
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-xcresult
          path: build/ci.xcresult

  android:
    name: Android unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Fetch the sherpa-onnx AAR (the speech models stay out of CI)
        run: |
          scripts/fetch-models.sh --aar-only
          mkdir -p speechmodels/src/main/assets
      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports
          path: android/app/build/reports/tests
